<!DOCTYPE html>
<html lang="pt-br">
 
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Buscador de CEP</title>
   <link rel="stylesheet" href="style.css">
</head>
 
<body>
   <header id="header">Busca CEP</header>
   
   <main id="main">

      <h2>Consulte CEPs de forma simples e rápida:</h2>

      <input type="text" id="input_bar" placeholder="Digite o CEP..."></input>

      <button class="search_button">BUSCAR</button>

      <div class="lista" id="resultado_atual"></div>
      
      <h3>Histórico:</h3>
      
      <div class="lista" id="historico"></div>

   </main>

   <footer id="footer">
      <a id="github" href="https://github.com/Peressjj/Buscador-de-CEPs.git">
         <ion-icon name="logo-github"></ion-icon>
      </a>
   </footer>

   <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
   <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
   
   <script src="script.js"></script>
</body>
 
</html>
